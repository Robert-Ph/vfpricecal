services:
  db:
    image: postgres:16-alpine
    container_name: vf-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres191002@th
      POSTGRES_DB: vf_database
    volumes:
      - vf_pgdata:/var/lib/postgresql/data
    networks:
      - vf-network

  backend:
    build: . # Build trực tiếp Dockerfile tại thư mục này
    container_name: vf-spring-be
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vf_database
      - DB_USER=postgres
      - DB_PASSWORD=Postgres191002@th
    depends_on:
      - db
    networks:
      - vf-network

volumes:
  vf_pgdata:

networks:
  vf-network:
    external: true # Khai báo mạng chung đã tạo ở Bước 1
